<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Offline · Mary Royal School</title>
  <style>
    :root {
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --primary: #1d4ed8;
      --border: #e2e8f0;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #020617;
        --card-bg: #0f172a;
        --text: #f8fafc;
        --muted: #94a3b8;
        --primary: #3b82f6;
        --border: #1e293b;
      }
    }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      min-height: 100vh;
      align-items: center;
      justify-content: center;
      padding: 16px;
      box-sizing: border-box;
    }
    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 32px 24px;
      max-width: 400px;
      width: 100%;
      text-align: center;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
    }
    .logo {
      width: 64px;
      height: 64px;
      margin: 0 auto 16px;
      display: block;
      border-radius: 16px;
    }
    h1 {
      font-size: 20px;
      font-weight: 600;
      margin: 0 0 8px;
    }
    p {
      font-size: 14px;
      color: var(--muted);
      line-height: 1.5;
      margin: 0 0 24px;
    }
    .btn {
      display: inline-block;
      width: 100%;
      box-sizing: border-box;
      background-color: var(--primary);
      color: #ffffff;
      font-size: 16px;
      font-weight: 600;
      padding: 12px 20px;
      border-radius: 14px;
      border: none;
      cursor: pointer;
      text-decoration: none;
      transition: opacity 0.2s;
    }
    .btn:active {
      opacity: 0.85;
    }
    .badge {
      display: inline-block;
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <div class="card">
    <img src="/mary-royal-logo.png" alt="Mary Royal School" class="logo">
    <h1>You're currently offline</h1>
    <p>Please check your internet or mobile data connection to sync school data with Mary Royal School.</p>
    <button class="btn" onclick="window.location.reload()">Retry Connection</button>
    <div class="badge">Mary Royal Junior School · Obunga, Kisumu</div>
  </div>
</body>
</html>
